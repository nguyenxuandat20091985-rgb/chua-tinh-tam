name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Smoke test combined dev server
        run: |
          node scripts/dev-all.js > /tmp/chua-tinh-tam-dev.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill -TERM "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; then
              echo "Frontend :3000 and TikTok server :3001 are responding."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chua-tinh-tam-dev.log
          echo "Combined dev server did not become ready in 30 seconds."
          exit 1
